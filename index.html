<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코치의 언어 학습 · Language Coach</title>
<style>
  :root{
    --paper:#F6F1E7; --card:#FFFDF8; --ink:#2A241E; --ink-soft:#6B6155;
    --lacquer:#BE3A31; --jade:#1C7A63; --gold:#B98A2E; --line:#E4DBCB;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#191510; --card:#241E17; --ink:#F2E9DA; --ink-soft:#B4A794;
    --lacquer:#E88178; --jade:#5FC9AC; --gold:#E0B457; --line:#39301F;
  }}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper); color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; align-items:center; justify-content:center; padding:28px 18px}
  .wrap{max-width:420px; width:100%; text-align:center}
  .eyebrow{font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--lacquer); font-weight:700}
  h1{font-family:Georgia,serif; font-size:30px; margin:8px 0 6px; letter-spacing:-.01em}
  .sub{color:var(--ink-soft); font-size:14.5px; margin-bottom:26px; line-height:1.6}
  .card{display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 18px; margin-bottom:13px;
    transition:transform .12s, border-color .15s}
  .card:active{transform:scale(.98)}
  .card .flag{font-size:38px; width:56px; height:56px; display:flex; align-items:center; justify-content:center;
    border-radius:14px; flex-shrink:0}
  .card.vi .flag{background:#CDE7DF} .card.en .flag{background:#E9C9C4}
  .card .t{flex:1; text-align:left}
  .card .t .h{font-size:18px; font-weight:700}
  .card .t .d{font-size:13px; color:var(--ink-soft); margin-top:2px}
  .card .go{font-size:22px; color:var(--gold)}
  .foot{margin-top:22px; font-size:12px; color:var(--ink-soft); line-height:1.7}
  .foot b{color:var(--jade)}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Language Coach · Đà Nẵng</p>
    <h1>코치의 언어 학습</h1>
    <p class="sub">매일 15분, 시험 통과하며 진짜 회화를 익히는 앱.<br>배우고 싶은 언어를 고르세요.</p>

    <a class="card vi" href="./vi/">
      <span class="flag">🇻🇳</span>
      <span class="t"><span class="h">베트남어</span><span class="d">Tiếng Việt · 하노이 발음</span></span>
      <span class="go">→</span>
    </a>
    <a class="card en" href="./en/">
      <span class="flag">🇬🇧</span>
      <span class="t"><span class="h">영어</span><span class="d">English · 회화 중심</span></span>
      <span class="go">→</span>
    </a>

    <p class="foot">💡 폰에서 <b>홈 화면에 추가</b>하면 앱처럼 열려요.<br>진행 상황은 각자 기기에 저장돼요 — 함께 써도 진도는 따로!</p>
  </div>
</body>
</html>
