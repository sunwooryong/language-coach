<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191510" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Tiếng Việt — 다낭 사격 코치의 베트남어 앱</title>
</head>
<body>

<style>
  :root{
    --paper:#F6F1E7; --card:#FFFDF8; --ink:#2A241E; --ink-soft:#6B6155;
    --lacquer:#BE3A31; --lacquer-soft:#E9C9C4; --jade:#1C7A63; --jade-soft:#CDE7DF;
    --gold:#B98A2E; --line:#E4DBCB; --shadow:rgba(60,45,25,.10);
    --lock:#B9B2A4;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#191510; --card:#241E17; --ink:#F2E9DA; --ink-soft:#B4A794;
    --lacquer:#E88178; --lacquer-soft:#4A2420; --jade:#5FC9AC; --jade-soft:#123A31;
    --gold:#E0B457; --line:#39301F; --shadow:rgba(0,0,0,.4); --lock:#5A5245;
  }}
  :root[data-theme="dark"]{
    --paper:#191510; --card:#241E17; --ink:#F2E9DA; --ink-soft:#B4A794;
    --lacquer:#E88178; --lacquer-soft:#4A2420; --jade:#5FC9AC; --jade-soft:#123A31;
    --gold:#E0B457; --line:#39301F; --shadow:rgba(0,0,0,.4); --lock:#5A5245;
  }
  :root[data-theme="light"]{
    --paper:#F6F1E7; --card:#FFFDF8; --ink:#2A241E; --ink-soft:#6B6155;
    --lacquer:#BE3A31; --lacquer-soft:#E9C9C4; --jade:#1C7A63; --jade-soft:#CDE7DF;
    --gold:#B98A2E; --line:#E4DBCB; --shadow:rgba(60,45,25,.10); --lock:#B9B2A4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper); overflow-x:hidden}
  .app{background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
    max-width:480px; margin:0 auto; min-height:100vh; position:relative;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right)}
  .up{color:var(--lacquer); font-weight:700}

  .topbar{position:sticky; top:0; z-index:20; background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
  .topbar .row{display:flex; align-items:center; gap:10px}
  .streak{font-size:14px; font-weight:700; color:var(--lacquer)}
  .topbar .meta{font-size:12px; color:var(--ink-soft); margin-left:auto}
  .gear{background:none; border:0; font-size:18px; cursor:pointer; color:var(--ink-soft); padding:2px 4px}
  .pbar{height:7px; background:var(--line); border-radius:20px; margin-top:9px; overflow:hidden}
  .pbar > span{display:block; height:100%; background:var(--jade); border-radius:20px; transition:width .4s}
  .pbar-label{font-size:11px; color:var(--ink-soft); margin-top:4px; display:flex; justify-content:space-between}

  .view{padding:18px 16px}
  .view.hide{display:none}
  h1{font-family:Georgia,serif; font-size:26px; letter-spacing:-.01em; margin-bottom:2px; text-wrap:balance}
  h1 .vn{color:var(--jade); font-style:italic}
  .sub{color:var(--ink-soft); font-size:14px; margin-bottom:18px}
  h2{font-family:Georgia,serif; font-size:19px; margin:22px 0 10px}
  h2:first-child{margin-top:2px}

  .today{background:var(--lacquer); color:#fff; border-radius:16px; padding:18px; margin-bottom:14px}
  .today .k{font-size:12px; letter-spacing:.12em; text-transform:uppercase; opacity:.85}
  .today .big{font-family:Georgia,serif; font-size:23px; margin:3px 0 3px}
  .today .d{font-size:13.5px; opacity:.92; margin-bottom:14px}
  .today button{background:#fff; color:var(--lacquer); border:0; font-weight:700; font-size:15px;
    padding:12px 20px; border-radius:11px; cursor:pointer; width:100%}
  .today.exam{background:var(--gold)}
  .today.exam button{color:var(--gold)}

  .quick{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px}
  .quick button{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:13px 10px; cursor:pointer; font:inherit; color:inherit; text-align:left; font-size:13.5px; font-weight:600}
  .quick button .i{font-size:20px; display:block; margin-bottom:5px}
  .quick button:active{transform:scale(.98)}

  .path .wk{margin-bottom:14px}
  .path .wk-t{font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--gold); text-transform:uppercase; margin-bottom:8px}
  .node{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:11px 13px; margin-bottom:7px; cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit}
  .node:disabled{cursor:default; opacity:.6}
  .node .badge{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; flex-shrink:0}
  .node.done .badge{background:var(--jade-soft); color:var(--jade)}
  .node.now .badge{background:var(--lacquer); color:#fff}
  .node.lock .badge{background:var(--line); color:var(--lock)}
  .node.exam .badge{background:var(--gold); color:#fff}
  .node .nm{font-size:14px; font-weight:600; flex:1}
  .node .st{font-size:12px; color:var(--ink-soft)}

  .wcard{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:12px;
    box-shadow:0 1px 2px var(--shadow); overflow:hidden}
  .wcard .main{display:flex; align-items:center; gap:13px; padding:15px 15px; cursor:pointer}
  .wcard .main:active{background:var(--jade-soft)}
  .spk{width:52px; height:52px; border-radius:14px; background:var(--lacquer-soft); color:var(--lacquer);
    display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0}
  .wcard.playing .spk{background:var(--lacquer); color:#fff}
  .wcard .body{flex:1; min-width:0}
  .tag{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em; padding:2px 8px; border-radius:20px; margin-bottom:5px}
  .tag.coach{background:var(--jade-soft); color:var(--jade)}
  .tag.love{background:var(--lacquer-soft); color:var(--lacquer)}
  .tag.react{background:var(--jade-soft); color:var(--jade)}
  .tag.survive{background:var(--gold); color:#fff}
  .vnw{font-size:21px; font-weight:700; letter-spacing:-.01em; line-height:1.2}
  .say{font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--jade); font-weight:600; margin-top:2px}
  .mean{font-size:14px; color:var(--ink-soft); margin-top:3px}
  .star{background:none; border:0; font-size:20px; cursor:pointer; color:var(--gold); padding:4px; align-self:flex-start}
  .wc-actions{display:flex; border-top:1px solid var(--line)}
  .wc-actions button, .wc-actions a{flex:1; text-align:center; padding:11px 6px; font-size:13px; font-weight:600;
    background:none; border:0; border-right:1px solid var(--line); cursor:pointer; color:var(--ink-soft); text-decoration:none; font-family:inherit}
  .wc-actions a:last-child, .wc-actions button:last-child{border-right:0}
  .wc-actions .g{color:var(--gold)}
  .examples{padding:4px 15px 12px; display:none}
  .examples.open{display:block}
  .ex{display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px dashed var(--line); cursor:pointer}
  .ex:active{opacity:.6}
  .ex .exicon{width:24px; height:24px; border-radius:8px; background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0}
  .ex .et{font-size:10px; font-weight:700; color:var(--gold); letter-spacing:.04em}
  .ex .evn{font-size:15px; font-weight:600}
  .ex .esay{font-family:ui-monospace,monospace; font-size:11.5px; color:var(--jade)}
  .ex .eko{font-size:12.5px; color:var(--ink-soft)}
  .ex-note{font-size:11.5px; color:var(--ink-soft); text-align:center; padding:6px 0 0}

  .primary{background:var(--jade); color:#fff; border:0; font-weight:700; font-size:16px; width:100%;
    padding:15px; border-radius:13px; cursor:pointer; margin-top:8px}
  .primary:active{transform:scale(.99)}
  .primary.done{background:var(--jade-soft); color:var(--jade)}
  .ghost{background:var(--card); border:1px solid var(--line); color:var(--ink); font-weight:600; font-size:14px;
    width:100%; padding:12px; border-radius:12px; cursor:pointer; margin-top:8px}

  .exam-q{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 17px; margin-bottom:14px; text-align:center}
  .exam-prog{font-size:12px; color:var(--ink-soft); margin-bottom:14px; font-weight:600}
  .qprompt{font-size:15px; color:var(--ink-soft); margin-bottom:6px}
  .qbig{font-size:26px; font-weight:700; margin-bottom:6px}
  .qspk{width:76px; height:76px; border-radius:50%; background:var(--lacquer); color:#fff; border:0;
    font-size:34px; margin:6px auto 8px; display:flex; align-items:center; justify-content:center; cursor:pointer}
  .opts{display:grid; gap:9px; margin-top:14px}
  .opt{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:16px;
    font-weight:600; cursor:pointer; font-family:inherit; color:inherit}
  .opt:active{transform:scale(.99)}
  .opt.ok{background:var(--jade); color:#fff; border-color:var(--jade)}
  .opt.no{background:var(--lacquer); color:#fff; border-color:var(--lacquer)}
  .opt:disabled{cursor:default}

  .result{text-align:center; padding:16px 6px}
  .result .score{font-size:52px; font-weight:800; font-family:Georgia,serif}
  .result.pass .score{color:var(--jade)}
  .result.fail .score{color:var(--lacquer)}
  .result .msg{font-size:15px; margin:8px 0 4px}
  .result .list{text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin:14px 0; font-size:13.5px}
  .result .list div{padding:5px 0; border-bottom:1px dashed var(--line)}
  .result .list div:last-child{border-bottom:0}

  .search{width:100%; padding:13px 15px; font-size:16px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); color:inherit; font-family:inherit; margin-bottom:6px}
  .tones{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:16px}
  .tone{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; cursor:pointer; text-align:left; font:inherit; color:inherit}
  .tone .w{font-size:22px; font-weight:700}
  .tone .a{font-size:12px; color:var(--gold); font-weight:700}
  .tone .m{font-size:12px; color:var(--ink-soft)}

  .np{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:22px 18px;
    margin-bottom:14px; min-height:210px; display:flex; flex-direction:column; justify-content:center; text-align:center}
  .np.vi{border-color:var(--lacquer)} .np.ko{border-color:var(--jade)} .np.wait{border-color:var(--gold)}
  .np .lang{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--gold)}
  .np .big{font-size:27px; font-weight:800; margin:9px 0 4px; line-height:1.25; word-break:keep-all}
  .np .say2{font-family:ui-monospace,monospace; font-size:13.5px; color:var(--jade); font-weight:600}
  .np .kox{font-size:16px; color:var(--ink-soft); margin-top:8px}
  .np .cue{font-size:13.5px; font-weight:700; color:var(--lacquer); margin-top:12px}
  .np .pos{font-size:11.5px; color:var(--ink-soft); margin-top:10px}
  .ctrls{display:flex; gap:12px; justify-content:center; align-items:center; margin-bottom:16px}
  .ctrls button{background:var(--card); border:1px solid var(--line); border-radius:50%; width:54px; height:54px;
    font-size:20px; cursor:pointer; color:inherit; display:flex; align-items:center; justify-content:center}
  .ctrls .pp{width:70px; height:70px; background:var(--lacquer); color:#fff; border-color:var(--lacquer); font-size:27px}
  .ctrls button:active{transform:scale(.93)}
  .cfg-label{font-size:11.5px; font-weight:700; color:var(--ink-soft); margin:14px 0 7px; letter-spacing:.06em; text-transform:uppercase}
  .chips{display:flex; gap:7px; flex-wrap:wrap}
  .chip{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:9px 14px; font-size:13px;
    font-weight:600; cursor:pointer; color:var(--ink-soft); font-family:inherit}
  .chip.on{background:var(--jade); color:#fff; border-color:var(--jade)}
  .nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    background:var(--card); border-top:1px solid var(--line); display:flex; z-index:30;
    padding-bottom:env(safe-area-inset-bottom)}
  .nav button{flex:1; background:none; border:0; padding:8px 2px 9px; cursor:pointer; color:var(--ink-soft); font:inherit; min-width:0}
  .nav button .ni{font-size:20px; display:block}
  .nav button .nl{font-size:10px; margin-top:2px}
  .sheet .inner{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  @media (max-width:340px){
    .app .view{padding:14px 12px}
    h1{font-size:23px} .today .big{font-size:20px} .vnw{font-size:19px}
    .quick{grid-template-columns:1fr} .tones,.tone-grid{grid-template-columns:1fr}
    .nav button .nl{font-size:9px} .spk{width:46px;height:46px;font-size:21px}
  }
  @media (min-width:481px){
    .app{border-left:1px solid var(--line); border-right:1px solid var(--line)}
  }
  .nav button.on{color:var(--lacquer)}

  .sheet{position:fixed; inset:0; background:rgba(30,20,10,.5); z-index:40; display:none; align-items:flex-end}
  .sheet.open{display:flex}
  .sheet .inner{background:var(--paper); width:100%; max-width:460px; margin:0 auto; border-radius:18px 18px 0 0; padding:20px 18px 28px; max-height:82vh; overflow:auto}
  .sheet h2{margin-top:0}
  textarea{width:100%; min-height:90px; border:1px solid var(--line); border-radius:10px; padding:10px; font-family:ui-monospace,monospace; font-size:12px; background:var(--card); color:inherit}
  .hint{font-size:12px; color:var(--ink-soft); background:var(--jade-soft); border-radius:10px; padding:10px 12px; margin:10px 0; line-height:1.6}
  .banner-pass{background:var(--jade); color:#fff; border-radius:14px; padding:16px; text-align:center; margin-bottom:14px}
  .empty{text-align:center; color:var(--ink-soft); font-size:14px; padding:30px 10px}
</style>

<div class="app" id="app">
  <div class="topbar">
    <div class="row">
      <span class="streak" id="streak">🔥 0일</span>
      <span class="meta" id="weekmeta">Week 1</span>
      <button class="gear" id="gearBtn" aria-label="설정">⚙️</button>
    </div>
    <div class="pbar"><span id="pbar"></span></div>
    <div class="pbar-label"><span id="pbarL">진도</span><span id="pbarR"></span></div>
  </div>

  <div class="view" id="v-home"></div>
  <div class="view hide" id="v-lesson"></div>
  <div class="view hide" id="v-review"></div>
  <div class="view hide" id="v-exam"></div>
  <div class="view hide" id="v-cheat"></div>
  <div class="view hide" id="v-basics"></div>
  <div class="view hide" id="v-hands"></div>

  <div class="nav" id="nav">
    <button data-nav="home" class="on"><span class="ni">🏠</span><span class="nl">홈</span></button>
    <button data-nav="lesson"><span class="ni">📖</span><span class="nl">수업</span></button>
    <button data-nav="review"><span class="ni">🔁</span><span class="nl">복습</span></button>
    <button data-nav="cheat"><span class="ni">⚡</span><span class="nl">치트</span></button>
    <button data-nav="basics"><span class="ni">🔊</span><span class="nl">발음</span></button>
  </div>

  <div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>
  <audio id="silentAnchor" loop playsinline style="display:none"
    src="data:audio/wav;base64,UklGRsQPAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YaAPAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA">
  </audio>
</div>

<script>
(function(){
"use strict";

/* ============ 단어 데이터 (VOCAB) — 자동 생성 작업이 이 배열에 이어붙인다 ============ */
/* 형식: [분류, 베트남어, 한국어뜻, 발음, [ [예문유형, 베트남어, 한국어, 발음] x3 ] ]
   예문유형: q=질문, a=답변, c=자주쓰는말.  분류: coach/love/react/survive
   ★★★ 자동작업 규칙: 아래 VOCAB_START ~ VOCAB_END 사이에 새 항목만 추가할 것 ★★★ */
var VOCAB = [
/*VOCAB_START*/
["react","Chào","안녕 · 인사하다","짜오↘",[["a","Chào anh!","안녕하세요!","짜오↘ 아잉"],["c","Chào các em!","얘들아 안녕!","짜오↘ 깍↗ 앰"],["q","Em khỏe không?","잘 지내요?","앰 쾌↘↗ 콤"]]],

/* ============ 상태 (localStorage) ============ */
var KEY="vn_app_v1";
var S=load();
function load(){
  try{var r=JSON.parse(localStorage.getItem(KEY)); if(r&&r.v===1) return r;}catch(e){}
  return {v:1, currentDay:1, streak:0, lastDate:"", weekPlan:[3], wordsPerDay:3,
          srs:{}, fav:[], exam:{}, lastSig:""};
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function daysBetween(a,b){ if(!a) return 99; var x=new Date(a), y=new Date(b); return Math.round((y-x)/86400000); }
function touchStreak(){
  var t=today(); if(S.lastDate===t) return;
  var gap=daysBetween(S.lastDate,t);
  S.streak = (gap===1)? S.streak+1 : 1;
  S.lastDate=t; save();
}

/* ============ 스케줄(주차/일차) 계산 ============ */
function wpdForWeek(w){ return S.weekPlan[w]!=null ? S.weekPlan[w] : S.wordsPerDay; }
function weekStartWord(w){ var s=0; for(var i=0;i<w;i++) s+=LESSONS_PER_WEEK*wpdForWeek(i); return s; }
// 글로벌 일차 g(1부터) → 정보
function dayInfo(g){
  var week=Math.floor((g-1)/8), pos=(g-1)%8;
  if(pos===LESSONS_PER_WEEK) return {g:g,week:week,type:"exam"};
  var wpd=wpdForWeek(week), start=weekStartWord(week)+pos*wpd;
  var words=VOCAB.slice(start,start+wpd);
  return {g:g,week:week,type:"lesson",lessonIdx:pos,words:words,start:start,wpd:wpd,ready:words.length>=1};
}
function weekWords(week){ return VOCAB.slice(weekStartWord(week), weekStartWord(week)+LESSONS_PER_WEEK*wpdForWeek(week)); }
function totalWordsPlanned(){ return VOCAB.length; }

/* ============ 발음(TTS) ============ */
var rate=0.82, curCard=null;
function viVoice(){ var vs=speechSynthesis?speechSynthesis.getVoices():[]; return vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("vi")===0;})[0]||null; }
function speak(text,el){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text); u.lang="vi-VN"; u.rate=rate; var v=viVoice(); if(v)u.voice=v;
  if(el){ if(curCard)curCard.classList.remove("playing"); curCard=el; el.classList.add("playing");
    u.onend=u.onerror=function(){el.classList.remove("playing");}; }
  speechSynthesis.speak(u);
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=viVoice;
function gLink(t){ return GURL.indexOf("http")?"#":"https://translate.google.com/?sl=vi&tl=ko&op=translate&text="+encodeURIComponent(t); }
function arrows(s){ return s.replace(/([↗↘↓˜]+)/g,'<span class="up">$1</span>'); }
function esc(s){ return (s+"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ============ 화면 전환 ============ */
var VIEWS=["home","lesson","review","exam","cheat","basics","hands"];
function show(v){
  VIEWS.forEach(function(x){ var el=document.getElementById("v-"+x); if(el) el.classList.toggle("hide",x!==v); });
  document.querySelectorAll("#nav button").forEach(function(b){ b.classList.toggle("on",b.dataset.nav===v); });
  window.scrollTo(0,0); renderTop();
  if(v==="home")renderHome(); else if(v==="lesson")renderLesson(); else if(v==="review")renderReview();
  else if(v==="exam")renderExam(); else if(v==="cheat")renderCheat(); else if(v==="basics")renderBasics();
  else if(v==="hands")renderHands();
  if(v!=="hands") handsStop(true);
}
document.getElementById("nav").addEventListener("click",function(e){ var b=e.target.closest("button"); if(b) show(b.dataset.nav); });
document.getElementById("gearBtn").addEventListener("click",openSettings);

/* ============ 상단바 ============ */
function renderTop(){
  document.getElementById("streak").textContent="🔥 "+S.streak+"일";
  var g=S.currentDay, info=dayInfo(g), week=info.week;
  document.getElementById("weekmeta").textContent="Week "+(week+1)+" · Day "+g;
  var done=g-1, total=Math.max(done+1, totalWordsPlanned()? Math.ceil(totalWordsPlanned()/3):done+1);
  var pct=Math.min(100, Math.round(done/(done+1+ (info.type==='exam'?0:0))*100));
  // 진도: 이번 주차 내 위치
  var pos=(g-1)%8, wpct=Math.round(Math.min(pos,7)/8*100);
  document.getElementById("pbar").style.width=wpct+"%";
  document.getElementById("pbarL").textContent="이번 주차 진도";
  document.getElementById("pbarR").textContent=(pos>=7?"시험":(pos+"/7 완료"));
}

window.__go=show;
function renderPath(){
  var g=S.currentDay, lastWeek=Math.floor((g-1)/8), out="";
  for(var w=0; w<=lastWeek+0; w++){
    out+='<div class="wk"><div class="wk-t">Week '+(w+1)+' · 하루 '+wpdForWeek(w)+'단어</div>';
    for(var pos=0; pos<8; pos++){
      var gg=w*8+pos+1, info=dayInfo(gg);
      var cls, st, label, badge, dis="";
      if(gg<g){ cls=info.type==="exam"?"done exam":"done"; badge=info.type==="exam"?"🎯":"✓"; st="완료"; }
      else if(gg===g){ cls=info.type==="exam"?"now exam":"now"; badge=info.type==="exam"?"🎯":"▶"; st="오늘"; }
      else { cls="lock"; badge="🔒"; st="잠김"; dis="disabled"; }
      label=info.type==="exam"?("Day "+gg+" · 시험"):("Day "+gg+" · 수업");
      out+='<button class="node '+cls+'" '+dis+' onclick="__openDay('+gg+')"><span class="badge">'+badge+'</span>'
          +'<span class="nm">'+label+'</span><span class="st">'+st+'</span></button>';
    }
    out+='</div>';
  }
  document.getElementById("pathWrap").innerHTML=out;
}
window.__openDay=function(g){ if(g>S.currentDay) return; var info=dayInfo(g);
  if(info.type==="exam"){ if(g===S.currentDay) show("exam"); else { alert("이미 통과한 시험이에요."); } }
  else { viewLessonDay=g; show("lesson"); } };

  var review = g<S.currentDay;
  var h='<h1>Day '+g+' <span class="vn">수업</span></h1><p class="sub">'+(review?'복습 중 — 카드를 눌러 발음을 들어보세요.':'카드를 누르면 발음이 나와요. 예문도 꼭 들어보세요.')+'</p>';

var exam=null;
function buildExam(week){
  var pool=weekWords(week).map(function(w,i){ return {id:weekStartWord(week)+i, w:w}; }).filter(function(x){return x.w;});
  if(pool.length<4) return null;
  var types=["listen","ko2vn","vn2ko"];
  var qs=[], guard=0, sig;
  do{
    qs=[]; var order=shuffle(pool.slice());
    for(var i=0;i<EXAM_QS;i++){
      var item=order[i%order.length];
      var type=types[Math.floor(Math.random()*types.length)];
      qs.push(makeQ(item,type,pool));
    }
    qs=shuffle(qs);
    sig=qs.map(function(q){return q.id+q.type;}).join("|");
    guard++;
  } while(sig===S.lastSig && guard<6);
  S.lastSig=sig; save();
  return {week:week, qs:qs, pos:0, correct:0, wrong:[]};
}
function makeQ(item,type,pool){
  var w=item.w, q={id:item.id,type:type,word:w};
  if(type==="ko2vn"){ q.prompt=w[2]; q.audio=null; q.showText=null; q.answer=w[1];
    q.opts=optSet(w[1], pool.map(function(p){return p.w[1];})); }
  else { // listen / vn2ko : 답은 한국어 뜻
    q.answer=w[2]; q.opts=optSet(w[2], pool.map(function(p){return p.w[2];}));
    if(type==="listen"){ q.audio=w[1]; q.showText=null; } else { q.audio=null; q.showText=w[1]; }
  }
  return q;
}
function optSet(correct, all){
  var pool=all.filter(function(x){return x!==correct;});
  var picks=shuffle(pool).slice(0,3); picks.push(correct);
  return shuffle(picks).map(function(t){return {t:t, ok:t===correct};});
}
function makeOptions(id,field){ // 복습용
  var correct=VOCAB[id][field==="ko"?2:1];
  var all=VOCAB.map(function(w){return w[field==="ko"?2:1];});
  return optSet(correct, all);
}

var HP={q:[],i:0,on:false,timer:null,ids:[],loops:0,spokeAt:0,spokeIdx:-1};

function keepAliveStart(){
  if(hpAlive) return;

    try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){}
    // 워치독: 말하기 항목이 너무 오래 끝나지 않으면(백그라운드에서 onend 유실 등) 강제로 다음으로
    var a=HP.q[HP.i];

      try{ speechSynthesis.cancel(); }catch(e){}

}

function HC(){ if(!S.hands||typeof S.hands!=="object") S.hands={}; var d={mode:"ko",rep:2,gap:2.5,set:"today",ex:true,shuffle:false}; for(var k in d){ if(S.hands[k]===undefined||S.hands[k]===null) S.hands[k]=d[k]; } return S.hands; }

  var d=dayInfo(S.currentDay);
  var n = (d.type==="lesson"&&d.words&&d.words.length) ? d.start+d.words.length
        : weekStartWord(d.week)+LESSONS_PER_WEEK*wpdForWeek(d.week);
  return Math.min(Math.max(n,1), VOCAB.length);
}

  if(c.ex){
    w[4].forEach(function(e){
      if(c.mode==="ko"){ K(e[2],"예문 — 이걸 베트남어로?",e); P(think,"🤔 생각해보세요…",e); V(e[1],"🗣 따라 말해보세요",e); P(shadow,"🗣 따라 말하기",e); }
      else { V(e[1],"예문 — 무슨 뜻?",e); P(think,"🤔 생각해보세요…",e); K(e[2],"✓ 뜻 확인",e); V(e[1],"🗣 따라 말해보세요",e); P(shadow,"🗣 따라 말하기",e); }
    });
  }
  P(500,"");
  return a;
}
function handsBuild(){
  HP.ids=handsItems(); HP.q=[];
  HP.ids.forEach(function(id,k){ HP.q=HP.q.concat(itemActions(id,k)); });
  HP.i=0;
}
var wakeLock=null;
function keepAwake(on){
  try{
    if(on && navigator.wakeLock && !wakeLock){
      navigator.wakeLock.request("screen").then(function(w){
        wakeLock=w;
        w.addEventListener("release",function(){ wakeLock=null; if(HP.on) keepAwake(true); });
      },function(){});
    }
    else if(!on && wakeLock){ wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
document.addEventListener("visibilitychange",function(){ if(!document.hidden && HP.on){ keepAwake(true); bgAudioStart(); try{speechSynthesis.resume();}catch(e){} if(!speechSynthesis.speaking && !speechSynthesis.pending){ clearTimeout(HP.timer); handsStep(); } } });
window.addEventListener("focus",function(){ if(HP.on){ keepAwake(true); bgAudioStart(); } });

/* 무음 오디오를 계속 재생 → 브라우저가 "오디오 재생 중" 탭으로 취급해
   화면이 꺼지거나 백그라운드로 가도 탭이 덜 정지되게 함 (특히 안드로이드) */
var silentAnchor=document.getElementById("silentAnchor");
function bgAudioStart(){
  if(!silentAnchor) return;
  try{ silentAnchor.play().catch(function(){}); }catch(e){}
}
function bgAudioStop(){ if(!silentAnchor) return; try{ silentAnchor.pause(); }catch(e){} }
if(silentAnchor) silentAnchor.addEventListener("ended",bgAudioStart);

function setupMediaSession(){
  if(!("mediaSession" in navigator)) return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:"베트남어 핸즈프리 학습",artist:"코치님",album:"Tiếng Việt"});
    navigator.mediaSession.setActionHandler("play",function(){ __hPlay(); var b=document.getElementById("ppBtn"); if(b)b.textContent="⏸"; });
    navigator.mediaSession.setActionHandler("pause",function(){ handsStop(); });
    navigator.mediaSession.setActionHandler("previoustrack",function(){ __hJump(-1); });
    navigator.mediaSession.setActionHandler("nexttrack",function(){ __hJump(1); });
  }catch(e){}
}
function setMediaPlaybackState(state){
  if(!("mediaSession" in navigator)) return;
  try{ navigator.mediaSession.playbackState=state; }catch(e){}
}
function handsStep(){
  if(!HP.on) return;
  if(HP.i>=HP.q.length){ HP.loops++; HP.i=0; if(HC().shuffle) handsBuild(); }
  var a=HP.q[HP.i]; if(!a){ HP.on=false; return; }
  renderNow(a);
  if(a.t==="pause"){ HP.timer=setTimeout(function(){ HP.i++; handsStep(); }, a.ms); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  var myIdx=HP.i; HP.spokeAt=Date.now(); HP.spokeIdx=HP.i;
  var u=new SpeechSynthesisUtterance(a.text);
  if(a.t==="ko"){ u.lang="ko-KR"; u.rate=1.0; var kv=koVoice(); if(kv)u.voice=kv; }
  else { u.lang="vi-VN"; u.rate=rate; var vv=viVoice(); if(vv)u.voice=vv; }
  u.onend=u.onerror=function(){ if(!HP.on)return; if(HP.i!==myIdx)return; HP.i++; HP.timer=setTimeout(handsStep,120); };
  try{ speechSynthesis.speak(u); }catch(e){}
  try{ speechSynthesis.resume(); }catch(e){}
}
function handsStop(silent){
  HP.on=false; clearTimeout(HP.timer);
  try{ speechSynthesis.cancel(); }catch(e){}
  keepAwake(false); bgAudioStop(); keepAliveStop(); setMediaPlaybackState("paused");
  if(!silent){ var b=document.getElementById("ppBtn"); if(b) b.textContent="▶"; }
}
window.__hands=function(){ show("hands"); };
window.__hPlay=function(){
  if(!HP.q.length) handsBuild();
  if(!HP.q.length){ alert("들을 내용이 아직 없어요. 수업을 먼저 진행해주세요."); return; }
  HP.on=true; keepAwake(true); bgAudioStart(); setupMediaSession(); setMediaPlaybackState("playing"); keepAliveStart(); handsStep();
  var b=document.getElementById("ppBtn"); if(b) b.textContent="⏸";
};
window.__hToggle=function(){ if(HP.on){ handsStop(); } else { __hPlay(); } };
window.__hJump=function(dir){
  if(!HP.q.length) handsBuild();
  var cur=HP.q[HP.i]?HP.q[HP.i].k:0, target=cur+dir;
  if(target<0) target=HP.ids.length-1; if(target>=HP.ids.length) target=0;
  for(var i=0;i<HP.q.length;i++){ if(HP.q[i].k===target){ HP.i=i; break; } }
  clearTimeout(HP.timer); try{speechSynthesis.cancel();}catch(e){}
  if(HP.on) handsStep(); else renderNow(HP.q[HP.i]);
};
window.__hSet=function(key,val){
  var c=HC();
  if(key==="rep"||key==="gap") val=parseFloat(val);
  if(key==="ex"||key==="shuffle") val=!c[key];
  c[key]=val; save();
  var wasOn=HP.on; handsStop(true); handsBuild(); renderHands();
  if(wasOn){ __hPlay(); }
};
function val_isOn(key){ return !!HC()[key]; }
function renderNow(a){
  var el=document.getElementById("npBox"); if(!el||!a) return;
  var w=VOCAB[a.id]; if(!w) return;
  var cls="np "+(a.t==="pause"?"wait":a.t);
  var h='<div class="lang">'+(a.t==="ko"?"한국어":(a.t==="vi"?"Tiếng Việt":"···"))+(a.ex?" · 예문":"")+'</div>';
  if(a.ex){
    h+='<div class="big">'+esc(a.ex[1])+'</div><div class="say2">'+arrows(esc(a.ex[3]))+'</div><div class="kox">'+esc(a.ex[2])+'</div>';
  } else {
    h+='<div class="big">'+esc(w[1])+'</div><div class="say2">'+arrows(esc(w[3]))+'</div><div class="kox">'+esc(w[2])+'</div>';
  }
  if(a.cue) h+='<div class="cue">'+a.cue+'</div>';
  h+='<div class="pos">'+((a.k|0)+1)+' / '+HP.ids.length+' · 반복 '+HP.loops+'회차</div>';
  el.className=cls; el.innerHTML=h;
}
function renderHands(){
  var c=HC(), el=document.getElementById("v-hands");
  if(!HP.q.length) handsBuild();
  function chips(key,opts){
    return opts.map(function(o){
      return '<button class="chip'+(String(c[key])===String(o[0])?" on":"")+'" onclick="__hSet(\''+key+'\',\''+o[0]+'\')">'+o[1]+'</button>';
    }).join("");
  }
  var h='<h1>🎧 핸즈프리 <span class="vn">오디오 코스</span></h1>'
    +'<p class="sub">걸으면서 들으세요. 뜻 → 생각 → 베트남어 → 따라 말하기 순으로 반복돼요.</p>'
    +'<div class="np wait" id="npBox"><div class="lang">준비됨</div><div class="big">▶ 를 눌러 시작</div>'
    +'<div class="kox">'+HP.ids.length+'개 단어 · 무한 반복</div></div>'
    +'<div class="ctrls">'
    +'<button onclick="__hJump(-1)" aria-label="이전">⏮</button>'
    +'<button class="pp" id="ppBtn" onclick="__hToggle()" aria-label="재생/정지">'+(HP.on?"⏸":"▶")+'</button>'
    +'<button onclick="__hJump(1)" aria-label="다음">⏭</button></div>'
    +'<div class="cfg-label">방식</div><div class="chips">'
    + chips("mode",[["ko","한국어 → 베트남어 (회상)"],["vn","베트남어 → 한국어 (듣기)"]])+'</div>'
    +'<div class="cfg-label">재생 범위</div><div class="chips">'
    + chips("set",[["today","오늘"],["week","이번 주차"],["review","복습 대상"],["fav","⭐ 즐겨찾기"],["all","배운 전체"]])+'</div>'
    +'<div class="cfg-label">베트남어 반복 횟수</div><div class="chips">'
    + chips("rep",[["1","1번"],["2","2번"],["3","3번"]])+'</div>'
    +'<div class="cfg-label">따라 말할 시간</div><div class="chips">'
    + chips("gap",[["1.5","짧게"],["2.5","보통"],["4","길게"]])+'</div>'
    +'<div class="cfg-label">옵션</div><div class="chips">'
    +'<button class="chip'+(c.ex?" on":"")+'" onclick="__hSet(\'ex\',1)">💬 예문 포함</button>'
    +'<button class="chip'+(c.shuffle?" on":"")+'" onclick="__hSet(\'shuffle\',1)">🔀 순서 섞기</button></div>'
    +'<div class="hint" style="margin-top:16px">🚶 <b>걸으면서 들을 때</b><br>· 재생 중엔 화면이 자동으로 안 꺼지고, 잠금화면에도 재생 컨트롤이 떠요.<br>· <b>안드로이드</b>: 화면을 꺼도(전원 버튼) 대부분 계속 재생돼요.<br>· <b>아이폰(사파리)</b>: 화면을 잠그면 브라우저 정책상 소리가 멈출 수 있어요 — 화면을 켠 채 주머니에 넣거나 화면 밝기를 낮춰서 사용하세요.<br>· 소리가 안 나오면 무음 모드 해제 후 ▶ 를 다시 눌러주세요.</div>'
    +'<button class="ghost" onclick="__go(\'home\')">홈으로</button>';
  el.innerHTML=h;
}

/* ============ 설정 / 백업 ============ */
function openSettings(){
  openSheet('<h2>⚙️ 설정 · 백업</h2>'
    +'<div class="hint">진행 상황은 <b>이 기기의 브라우저</b>에 저장돼요. 기기를 바꾸거나 데이터를 지우기 전에 백업을 내보내 두세요.</div>'
    +'<h2 style="font-size:16px">진행상황 내보내기</h2><p class="sub">아래 텍스트를 복사해 안전한 곳에 보관하세요.</p>'
    +'<textarea readonly id="expBox">'+esc(JSON.stringify(S))+'</textarea>'
    +'<button class="ghost" onclick="__copyExp()">복사하기</button>'
    +'<h2 style="font-size:16px">불러오기</h2><p class="sub">백업 텍스트를 붙여넣고 복원하세요.</p>'
    +'<textarea id="impBox" placeholder="백업 텍스트 붙여넣기"></textarea>'
    +'<button class="ghost" onclick="__import()">복원하기</button>'
    +'<button class="ghost" style="color:var(--lacquer)" onclick="__reset()">진행상황 초기화</button>');
}
window.__copyExp=function(){ var t=document.getElementById("expBox"); t.select(); try{document.execCommand("copy");}catch(e){} alert("복사됐어요."); };
window.__import=function(){ try{ var r=JSON.parse(document.getElementById("impBox").value); if(r&&r.v===1){ S=r; save(); closeSheet(); show("home"); alert("복원 완료!"); } else alert("형식이 올바르지 않아요."); }catch(e){ alert("불러오기 실패: "+e.message); } };
window.__reset=function(){ if(confirm("정말 처음부터 다시 시작할까요? (백업은 유지 안 됨)")){ localStorage.removeItem(KEY); S=load(); closeSheet(); show("home"); } };

/* ============ 바텀시트 ============ */
function openSheet(html){ document.getElementById("sheetInner").innerHTML=html; document.getElementById("sheet").classList.add("open"); }
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); try{speechSynthesis.cancel();}catch(e){} }
document.getElementById("sheet").addEventListener("click",function(e){ if(e.target.id==="sheet") closeSheet(); });

/* ============ 유틸 ============ */
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

/* ============ 시작 ============ */
show("home");
})();
</script>
</body>
