function stress(s){return esc(s).replace(/「([^」]*)」/g,'<span class="st">$1</span>');}
function plain(s){return String(s).replace(/[「」]/g,"");}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function addDays(str,n){var p=str.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function diffDays(a,b){var pa=a.split("-"),pb=b.split("-");return Math.round((new Date(+pb[0],+pb[1]-1,+pb[2])-new Date(+pa[0],+pa[1]-1,+pa[2]))/86400000);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function W(v){return {cat:v[0],en:v[1],ko:v[2],pr:v[3],ex:v[4]};}
function byEn(en){for(var i=0;i<VOCAB.length;i++){if(VOCAB[i][1]===en)return W(VOCAB[i]);}return null;}

/* ============ 상태 ============ */
var KEY="engCoach_v1";
var S=null;
function fresh(){return{curDay:1,done:{},sizes:{1:3},examTries:{},examFirstDate:{},lastExamSig:"",srs:{},fav:{},streak:0,lastActive:"",theme:"",rate:0.85,hf:{mode:"ko2en",scope:"today",rep:2,gap:"normal",ex:false,shuf:true,loop:true}};}
function load(){try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):fresh();}catch(e){S=fresh();}
  var f=fresh();for(var k in f){if(S[k]===undefined)S[k]=f[k];}
  if(!S.hf)S.hf=f.hf; for(var k2 in f.hf){if(S.hf[k2]===undefined)S.hf[k2]=f.hf[k2];}
  touchStreak();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function touchStreak(){var t=todayStr();if(!S.lastActive){S.streak=1;S.lastActive=t;save();return;}
  var d=diffDays(S.lastActive,t);if(d===0)return;if(d===1){S.streak++;}else{S.streak=1;}S.lastActive=t;save();}

/* ============ 일정 계산 ============ */
function weekOf(day){return Math.floor((day-1)/8)+1;}
function dayInWeek(day){return ((day-1)%8)+1;} /* 1~7 수업, 8 시험 */
function sizeOf(w){return S.sizes[w]||3;}
function weekStartIdx(w){var s=0;for(var i=1;i<w;i++){s+=sizeOf(i)*7;}return s;}
function wordsForDay(day){
  var w=weekOf(day),d=dayInWeek(day);if(d===8)return[];
  var n=sizeOf(w),st=weekStartIdx(w)+(d-1)*n,out=[];
  for(var i=st;i<st+n&&i<VOCAB.length;i++)out.push(W(VOCAB[i]));
  return out;
}
function weekWords(w){var n=sizeOf(w),st=weekStartIdx(w),out=[];
  for(var i=st;i<st+n*7&&i<VOCAB.length;i++)out.push(W(VOCAB[i]));return out;}
function learnedWords(){var out=[];for(var d=1;d<S.curDay;d++){if(dayInWeek(d)===8)continue;var ws=wordsForDay(d);for(var i=0;i<ws.length;i++)out.push(ws[i]);}return out;}
function isExamDay(day){return dayInWeek(day)===8;}
function weekProgress(){var w=weekOf(S.curDay);var d=dayInWeek(S.curDay);return{w:w,d:d,pct:Math.round(((d-1)/8)*100)};}

/* ============ 음성 ============ */
var voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(lang){for(var i=0;i<voices.length;i++){if(voices[i].lang&&voices[i].lang.replace("_","-").toLowerCase()===lang.toLowerCase())return voices[i];}
  var p=lang.split("-")[0];for(var j=0;j<voices.length;j++){if(voices[j].lang&&voices[j].lang.toLowerCase().indexOf(p)===0)return voices[j];}return null;}
function say(text,lang,rate){
  return new Promise(function(res){
    if(!window.speechSynthesis){res();return;}
    try{
      var u=new SpeechSynthesisUtterance(plain(text));
      u.lang=lang||"en-US";u.rate=rate||S.rate||0.85;
      var v=pickVoice(u.lang);if(v)u.voice=v;
      u.onend=function(){res();};u.onerror=function(){res();};
      speechSynthesis.cancel();speechSynthesis.speak(u);
      setTimeout(function(){res();},12000);
    }catch(e){res();}
  });
}
function speak(t,l){say(t,l||"en-US");}
function gLink(t){return "https://translate.google.com/?sl=en&tl=ko&op=translate&text="+encodeURIComponent(plain(t));}

/* ============ SRS ============ */
var INTERVALS=[1,1,2,4,7,14,30];
function srsRegister(en){if(!S.srs[en])S.srs[en]={n:0,due:addDays(todayStr(),1)};}
function srsAnswer(en,ok){var r=S.srs[en];if(!r){srsRegister(en);r=S.srs[en];}
  if(ok){r.n=Math.min(r.n+1,INTERVALS.length-1);}else{r.n=0;}
  r.due=addDays(todayStr(),INTERVALS[r.n]);save();}
function dueWords(){var t=todayStr(),out=[];
  for(var en in S.srs){if(diffDays(S.srs[en].due,t)>=0){var w=byEn(en);if(w)out.push(w);}}
  return out;}

/* ============ 문제 생성 ============ */
function makeQ(pool,word,type){
  var others=[];for(var i=0;i<pool.length;i++){if(pool[i].en!==word.en)others.push(pool[i]);}
  shuffle(others);var d=others.slice(0,3);
  var opts,ans,prompt,ptype;
  if(type===0){ /* 듣기 -> 뜻 */
    opts=[word.ko];for(var a=0;a<d.length;a++)opts.push(d[a].ko);
    ans=word.ko;prompt="🔊 듣고 뜻을 고르세요";ptype="listen";
  }else if(type===1){ /* 뜻 -> 영어 */
    opts=[word.en];for(var b=0;b<d.length;b++)opts.push(d[b].en);
    ans=word.en;prompt=word.ko;ptype="ko2en";
  }else{ /* 영어 -> 뜻 */
    opts=[word.ko];for(var c=0;c<d.length;c++)opts.push(d[c].ko);
    ans=word.ko;prompt=word.en;ptype="en2ko";
  }
  while(opts.length<4)opts.push("—");
  shuffle(opts);
  return{en:word.en,ko:word.ko,pr:word.pr,type:ptype,prompt:prompt,opts:opts,ans:ans};
}
function buildExam(w){
  var pool=weekWords(w);if(pool.length<2)return[];
  var best=null;
  for(var attempt=0;attempt<12;attempt++){
    var qs=[],types=[];
    for(var i=0;i<20;i++)types.push(i%3);
    shuffle(types);
    var bag=[];
    while(bag.length<20){var c=pool.slice();shuffle(c);bag=bag.concat(c);}
    bag=bag.slice(0,20);
    for(var j=0;j<20;j++)qs.push(makeQ(pool,bag[j],types[j]));
    shuffle(qs);
    var sig=qs.map(function(q){return q.en+"|"+q.type+"|"+q.opts.join(",");}).join("#");
    best=qs;
    if(sig!==S.lastExamSig){S.lastExamSig=sig;save();return qs;}
  }
  return best;
}

var LESSON_DAY=null;
RENDER.lesson=function(){
  var day=LESSON_DAY||S.curDay;LESSON_DAY=null;
  if(day>S.curDay)return '<div class="card">🔒 아직 잠긴 날이에요.<button class="btn o" onclick="go(\'home\')">홈으로</button></div>';
  if(isExamDay(day))return '<div class="card">오늘은 시험 날이에요 🎯<button class="btn" onclick="go(\'exam\')">시험 보기</button></div>';
  var ws=wordsForDay(day);
  if(!ws.length)return '<div class="card">준비된 단어를 모두 배웠어요. 내일 새 단어가 추가돼요!<button class="btn o" onclick="go(\'home\')">홈으로</button></div>';
  var out='<div class="card"><div class="row sp"><div><div class="sub">'+weekOf(day)+'주차</div>'
   +'<div style="font-size:20px;font-weight:900">'+day+'일차 수업</div></div>'
   +'<button class="mini" onclick="playDay('+day+')" style="margin:0">▶ 전체 듣기</button></div></div>';
  for(var i=0;i<ws.length;i++)out+=cardHTML(ws[i],i);
  if(S.done[day]){
    out+='<div class="card" style="text-align:center"><div style="font-weight:800">✅ 이 날은 완료했어요</div></div>';
  }else{
    out+='<button class="btn g" onclick="finishDay('+day+')">오늘 수업 완료 ✓</button>';
  }
  out+='<div style="height:6px"></div>';
  return out;
};
function finishDay(day){
  var ws=wordsForDay(day);
  for(var i=0;i<ws.length;i++)srsRegister(ws[i].en);
  S.done[day]=todayStr();
  if(day===S.curDay)S.curDay=day+1;
  save();go("home");
}
function playDay(day){
  var ws=wordsForDay(day);var i=0;
  (function next(){if(i>=ws.length)return;say(ws[i].en,"en-US").then(function(){
    return say(ws[i].ko,"ko-KR");}).then(function(){i++;next();});})();
}

var RV={list:[],i:0,answered:false,right:0};
RENDER.review=function(){
  if(!RV.list.length||RV.i>=RV.list.length){
    var due=dueWords();
    if(!due.length)return '<div class="card"><div style="font-size:19px;font-weight:900">😌 오늘 복습할 단어가 없어요</div>'
      +'<div class="sub" style="margin-top:6px">수업을 완료하면 자동으로 복습 일정이 잡혀요.</div>'
      +'<button class="btn o" onclick="startReviewAll()">그래도 배운 것 전체 복습</button></div>';
    return '<div class="card"><div style="font-size:19px;font-weight:900">🔁 복습 '+due.length+'단어</div>'
      +'<div class="sub" style="margin-top:6px">맞히면 다음 복습이 멀어지고, 틀리면 다시 처음부터예요.</div>'
      +'<button class="btn" onclick="startReview()">복습 시작</button></div>';
  }
  return quizHTML(RV,"rvPick","🔁 복습");
};
function startReview(){RV={list:shuffle(dueWords()).map(function(w){return makeQ(learnedWords().length>3?learnedWords():VOCAB.map(W),w,Math.floor(Math.random()*3));}),i:0,answered:false,right:0};go("review");}
function startReviewAll(){var L=learnedWords();if(!L.length)L=VOCAB.slice(0,6).map(W);
  RV={list:shuffle(L.slice()).map(function(w){return makeQ(L.length>3?L:VOCAB.map(W),w,Math.floor(Math.random()*3));}),i:0,answered:false,right:0};go("review");}
function rvPick(k){
  if(RV.answered)return;RV.answered=true;
  var q=RV.list[RV.i];var ok=(q.opts[k]===q.ans);
  if(ok)RV.right++;
  srsAnswer(q.en,ok);
  markOpts(k,q);
  setTimeout(function(){RV.i++;RV.answered=false;
    if(RV.i>=RV.list.length){alert("복습 끝! "+RV.right+" / "+RV.list.length+" 정답");RV.list=[];}
    go("review");},850);
}
function markOpts(k,q){
  var bs=document.querySelectorAll("#qopts .opt");
  for(var i=0;i<bs.length;i++){
    if(bs[i].getAttribute("data-t")===q.ans)bs[i].className="opt ok";
    else if(i===k)bs[i].className="opt no";
  }
}
function quizHTML(st,fn,title){
  var q=st.list[st.i];
  var head=(st.i+1)+" / "+st.list.length;
  var pr="";
  if(q.type==="listen"){pr='<button class="btn" onclick="speak(\''+q.en.replace(/'/g,"")+'\')">🔊 다시 듣기</button><div class="sub" style="text-align:center;margin-top:8px">듣고 뜻을 고르세요</div>';}
  else{pr='<div class="big">'+esc(q.prompt)+'</div><div class="sub" style="text-align:center">'+(q.type==="ko2en"?"→ 영어를 고르세요":"→ 뜻을 고르세요")+'</div>';}
  var out='<div class="card"><div class="row sp"><span class="tagc">'+title+'</span><b>'+head+'</b></div>'
   +'<div class="bar" style="margin-top:10px"><i style="width:'+Math.round(st.i/st.list.length*100)+'%"></i></div>'
   +'<div style="margin-top:16px">'+pr+'</div></div><div id="qopts">';
  for(var i=0;i<q.opts.length;i++)out+='<button class="opt" data-t="'+esc(q.opts[i])+'" onclick="'+fn+'('+i+')">'+esc(q.opts[i])+'</button>';
  out+='</div>';
  return out;
}

function startExam(){
  var w=weekOf(S.curDay);
  S.examTries[w]=(S.examTries[w]||0)+1;
  if(!S.examFirstDate[w])S.examFirstDate[w]=todayStr();
  save();
  EX={stage:"quiz",list:buildExam(w),i:0,answered:false,wrong:[],score:0};
  go("exam");
}
function exPick(k){
  if(EX.answered)return;EX.answered=true;
  var q=EX.list[EX.i];var ok=(q.opts[k]===q.ans);
  if(ok)EX.score++;else EX.wrong.push(q);
  srsAnswer(q.en,ok);
  markOpts(k,q);
  setTimeout(function(){
    EX.i++;EX.answered=false;
    if(EX.i>=EX.list.length){EX.stage="result";finishExam();}
    go("exam");
  },600);
}
function finishExam(){
  var w=weekOf(S.curDay);
  if(EX.score===20){
    var tries=S.examTries[w]||1;
    var cur=sizeOf(w),next=cur;
    if(tries===1&&S.examFirstDate[w]===todayStr())next=Math.min(cur+1,4);
    else if(S.examFirstDate[w]!==todayStr())next=Math.max(cur-1,2);
    S.sizes[w+1]=next;
    S.done[S.curDay]=todayStr();
    S.curDay=S.curDay+1;
    save();
  }
}

function buildSilentWavURL(){
  var sampleRate=8000,numSamples=sampleRate;
  var buf=new ArrayBuffer(44+numSamples);
  var view=new DataView(buf);
  function ws(o,s){for(var i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));}
  ws(0,"RIFF");view.setUint32(4,36+numSamples,true);ws(8,"WAVE");
  ws(12,"fmt ");view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true);view.setUint32(28,sampleRate,true);view.setUint16(32,1,true);view.setUint16(34,8,true);
  ws(36,"data");view.setUint32(40,numSamples,true);
  for(var i=0;i<numSamples;i++)view.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
function keepAliveStart(){
  var a=document.getElementById("keepAlive");if(!a)return;
  try{
    if(!a.src)a.src=buildSilentWavURL();

}
function keepAliveStop(){

    navigator.mediaSession.setActionHandler("pause",function(){if(HF.run)hfStop();});
    navigator.mediaSession.setActionHandler("previoustrack",function(){hfPrev();});
    navigator.mediaSession.setActionHandler("nexttrack",function(){hfNext();});
  }catch(e){}
}
function mediaSessionClear(){
  if(!("mediaSession" in navigator))return;
  try{
    navigator.mediaSession.playbackState="none";
    navigator.mediaSession.setActionHandler("play",null);
    navigator.mediaSession.setActionHandler("pause",null);
    navigator.mediaSession.setActionHandler("previoustrack",null);

function hfPool(){

  else if(h.scope==="week")base=weekWords(weekOf(S.curDay));

  else base=L;
  if(!base||!base.length)base=L.length?L:VOCAB.slice(0,3).map(W);
  var items=[];
  for(var i=0;i<base.length;i++){

  +'<button class="btn o" onclick="doReset()" style="color:var(--bad)">🗑️ 전체 초기화</button></div>'
  +'<div class="card"><h3 style="font-size:16px">현재 상태</h3>'
  +'<div style="margin-top:8px"><span class="pill">🔥 '+S.streak+'일</span><span class="pill">'+weekOf(S.curDay)+'주차</span>'
  +'<span class="pill">'+dayInWeek(S.curDay)+'/8일</span><span class="pill">배운 단어 '+learnedWords().length+'</span>'
  +'<span class="pill">전체 단어 '+VOCAB.length+'</span></div></div>'
  +'<button class="btn o" onclick="go(\'home\')">홈으로</button>';
};
function doExport(){
  var t=JSON.stringify(S);
  var b=document.getElementById("impbox");if(b)b.value=t;
  try{navigator.clipboard.writeText(t);alert("복사했어요! 메모장 등에 붙여넣어 보관하세요.");}
  catch(e){alert("아래 칸의 텍스트를 복사해 보관하세요.");}
}
function doImport(){
  var b=document.getElementById("impbox");if(!b||!b.value.trim())return alert("붙여넣은 내용이 없어요.");
  try{var o=JSON.parse(b.value);if(!o.curDay)throw 0;S=o;save();alert("불러왔어요!");go("home");}
  catch(e){alert("형식이 올바르지 않아요.");}
}
function doReset(){if(confirm("정말 전부 초기화할까요? 되돌릴 수 없어요.")){S=fresh();save();go("home");}}

/* ============ 부팅 ============ */
document.getElementById("setbtn").onclick=function(){go("settings");};
document.getElementById("thbtn").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var nx=cur==="dark"?"light":(cur==="light"?"":"dark");
  if(nx)document.documentElement.setAttribute("data-theme",nx);else document.documentElement.removeAttribute("data-theme");
  S.theme=nx;save();
};
var nb=document.querySelectorAll(".nav button");
for(var ni=0;ni<nb.length;ni++){(function(b){b.onclick=function(){if(HF.run&&b.getAttribute("data-v")!=="hands")hfStop();go(b.getAttribute("data-v"));};})(nb[ni]);}
load();
if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
go("home");
</script>
