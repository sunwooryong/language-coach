<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#FF6A2C">
<title>성격 조준소 · MBTI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#EEF1F5; --bg2:#E3E8EE; --card:#FFFFFF; --ink:#18222E; --ink2:#54606E;
    --line:#D6DCE4; --accent:#FF6A2C; --accent2:#159C8C; --gold:#E0A43B;
    --ring:#FFE0CE; --shadow:0 18px 40px -18px rgba(24,34,46,.28);
    --radius:20px; --maxw:460px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0E141C; --bg2:#0A0F16; --card:#182230; --ink:#EAF0F6; --ink2:#9BABBC;
      --line:#26333F; --accent:#FF7A42; --accent2:#2FC3B1; --gold:#E7B354; --ring:#3A2416; --shadow:0 22px 50px -18px rgba(0,0,0,.6); }
  }
  :root[data-theme="light"]{ --bg:#EEF1F5; --bg2:#E3E8EE; --card:#FFFFFF; --ink:#18222E; --ink2:#54606E;
    --line:#D6DCE4; --accent:#FF6A2C; --accent2:#159C8C; --gold:#E0A43B; --ring:#FFE0CE; --shadow:0 18px 40px -18px rgba(24,34,46,.28); }
  :root[data-theme="dark"]{ --bg:#0E141C; --bg2:#0A0F16; --card:#182230; --ink:#EAF0F6; --ink2:#9BABBC;
    --line:#26333F; --accent:#FF7A42; --accent2:#2FC3B1; --gold:#E7B354; --ring:#3A2416; --shadow:0 22px 50px -18px rgba(0,0,0,.6); }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,sans-serif;
    background:radial-gradient(120% 80% at 50% -10%, var(--bg2), var(--bg) 60%);
    color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);}
  .wrap{width:100%;max-width:var(--maxw);flex:1;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 6px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;min-width:0}
  .brand .tgt{width:22px;height:22px;flex:none}
  .brand small{display:block;font-size:9.5px;font-weight:600;color:var(--ink2);letter-spacing:.12em}
  .langsw{display:flex;gap:4px;flex:none}
  .langbtn{font-family:inherit;font-weight:800;font-size:11px;letter-spacing:.02em;padding:6px 9px;border-radius:9px;
    background:var(--card);border:1.5px solid var(--line);color:var(--ink2);cursor:pointer;transition:.15s}
  .langbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--accent);color:var(--accent)}

  .screen{flex:1;display:none;flex-direction:column;justify-content:center;padding:8px 0 20px;animation:in .45s cubic-bezier(.2,.7,.2,1)}
  .screen.active{display:flex}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen,.ryong{animation:none}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  h1{font-size:30px;line-height:1.12;letter-spacing:-.03em;font-weight:850;text-wrap:balance}
  h2{font-size:21px;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
  .lead{color:var(--ink2);font-size:15px;line-height:1.6;margin-top:14px}
  .eyebrow{font-size:11px;letter-spacing:.2em;font-weight:700;color:var(--accent);text-transform:uppercase}

  .hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .heroTarget{align-self:center;margin:6px 0 20px;filter:drop-shadow(0 10px 24px color-mix(in srgb,var(--accent) 35%,transparent))}
  .feat{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .featrow{display:flex;gap:11px;align-items:center;font-size:13.5px;color:var(--ink2)}
  .featrow .ic{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
  .countline{text-align:center;font-size:12px;color:var(--ink2);margin-top:12px;font-variant-numeric:tabular-nums}
  .countline b{color:var(--accent)}

  .btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:750;font-size:16px;border-radius:14px;padding:16px 20px;width:100%;color:#fff;letter-spacing:-.01em;
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));box-shadow:0 12px 24px -10px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .12s}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btnrow{display:flex;gap:10px;align-items:center}
  .helpbtn{flex:none;width:auto;padding:16px 18px;background:transparent;color:var(--ink2);border:1.5px solid var(--line);box-shadow:none;font-size:14px;font-weight:700}
  .stickycta{margin-top:auto;padding-top:16px}

  .field{margin-top:16px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:8px;letter-spacing:.02em}
  .field input{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:14px}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{flex:1;min-width:60px;text-align:center;font-weight:700;font-size:14.5px;padding:13px 8px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);color:var(--ink2);cursor:pointer;transition:.15s}
  .chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent);color:var(--accent)}
  .note{font-size:11.5px;color:var(--ink2);margin-top:18px;line-height:1.5;display:flex;gap:7px}
  .note svg{flex:none;margin-top:1px}

  .qhead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .qring{width:44px;height:44px;flex:none}
  .qmeta{font-size:12px;color:var(--ink2);font-weight:600;line-height:1.5}
  .qmeta #q-count{color:var(--ink);font-variant-numeric:tabular-nums}
  .qmeta #q-axis{color:var(--accent);font-weight:700}
  .progress{height:6px;background:var(--bg2);border-radius:100px;overflow:hidden;margin:14px 0 26px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:100px;transition:width .4s cubic-bezier(.3,.8,.3,1)}
  .qtext{font-size:22px;line-height:1.35;font-weight:800;letter-spacing:-.02em;text-wrap:balance;min-height:84px}
  .opts{display:flex;flex-direction:column;gap:11px;margin-top:22px}
  .opt{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;font-size:15.5px;font-weight:650;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:16px;cursor:pointer;transition:.15s}
  .opt:hover{border-color:var(--accent);transform:translateX(2px)}
  .opt .key{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--bg2);color:var(--ink2);font-size:14px;transition:.15s}
  .opt:hover .key{background:var(--accent);color:#fff}
  .qback{background:none;border:none;color:var(--ink2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px 0;margin-top:18px;align-self:flex-start}
  .pole{font-size:15px;font-weight:700;line-height:1.45;padding:14px 15px;border-radius:14px;border:1.5px solid var(--line);display:flex;gap:9px;align-items:flex-start}
  .poleA{background:color-mix(in srgb,var(--accent2) 9%,transparent);border-color:color-mix(in srgb,var(--accent2) 42%,transparent)}
  .poleB{background:color-mix(in srgb,var(--accent) 9%,transparent);border-color:color-mix(in srgb,var(--accent) 42%,transparent)}
  .ptag{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;margin-top:1px}
  .ptag.a{background:var(--accent2)}.ptag.b{background:var(--accent)}
  .scalehint{text-align:center;font-size:11.5px;color:var(--ink2);font-weight:600}
  .fhint{font-size:11px;color:var(--ink2);margin-top:7px;line-height:1.45}
  .dots{display:flex;align-items:flex-start;justify-content:center;gap:5px}
  .dcol{display:flex;flex-direction:column;align-items:center;gap:8px;width:46px}
  .dotlab{font-size:9px;color:var(--ink2);font-weight:600;text-align:center;line-height:1.2}
  .dcol .d{margin:0 auto}
  #r-weak{font-size:11.5px;color:var(--ink2);line-height:1.55;margin-top:12px}
  @media (max-width:360px){.dcol{width:40px}.dotlab{font-size:8px}}
  .d{border-radius:50%;border:2.5px solid var(--line);background:transparent;cursor:pointer;transition:.15s;padding:0}
  .d.a{border-color:var(--accent2)}.d.b{border-color:var(--accent)}
  .d3{width:42px;height:42px}.d2{width:35px;height:35px}.d1{width:28px;height:28px}.d0{width:23px;height:23px}
  .d.a:hover,.d.a.sel{background:color-mix(in srgb,var(--accent2) 40%,transparent)}
  .d.b:hover,.d.b.sel{background:color-mix(in srgb,var(--accent) 40%,transparent)}
  .d0:hover,.d0.sel{background:color-mix(in srgb,var(--ink2) 28%,transparent)}
  .d:active{transform:scale(.92)}
  #r-clarity{font-size:12.5px;color:var(--ink2);font-weight:700;margin-top:6px;text-align:center}
  #r-clarity b{color:var(--accent);font-variant-numeric:tabular-nums}
  .bar .lab{font-variant-numeric:tabular-nums}

  .rtype{display:flex;align-items:center;gap:16px}
  .rbadge{width:88px;height:88px;flex:none;border-radius:22px;display:grid;place-items:center;background:linear-gradient(150deg,var(--accent),var(--gold));color:#fff;box-shadow:0 14px 30px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
  .rbadge .code{font-size:24px;font-weight:850;letter-spacing:.02em}
  .rnick{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em}
  .rtitle{font-size:24px;font-weight:850;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
  .rdesc{font-size:14.5px;line-height:1.65;color:var(--ink2);margin-top:16px}
  .bars{display:flex;flex-direction:column;gap:13px;margin-top:22px}
  .bar{font-size:12px;font-weight:700}
  .bar .lab{display:flex;justify-content:space-between;color:var(--ink2);margin-bottom:6px}
  .bar .lab .on{color:var(--ink)}
  .bar .track{height:8px;background:var(--bg2);border-radius:100px;position:relative;overflow:hidden}
  .bar .track i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:100px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
  .mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}
  .mini .cap{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:700}
  .mini .big{font-size:17px;font-weight:800;margin-top:5px;display:flex;align-items:center;gap:7px}
  .mini p{font-size:12px;line-height:1.55;color:var(--ink2);margin-top:8px}
  .combo{margin-top:16px;padding:16px;border-radius:16px;border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .combo .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .combo p{font-size:13.5px;line-height:1.6;margin-top:8px;color:var(--ink)}
  .ractions{display:flex;gap:10px;margin-top:20px}
  .pad{padding:22px}.center{text-align:center}
  .footnote{text-align:center;font-size:11px;color:var(--ink2);padding:14px 0 4px;line-height:1.5}

  .ryongwrap{display:flex;justify-content:center;padding:20px 0 6px}
  .ryong{background:none;border:none;cursor:pointer;font-family:"Segoe UI",Arial,sans-serif;font-weight:900;font-size:15px;letter-spacing:.42em;padding:6px 10px 6px 16px;border-radius:10px;
    color:var(--accent);text-shadow:0 0 10px color-mix(in srgb,var(--accent) 70%,transparent),0 0 22px color-mix(in srgb,var(--accent) 45%,transparent);animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.72;text-shadow:0 0 8px color-mix(in srgb,var(--accent) 55%,transparent),0 0 18px color-mix(in srgb,var(--accent) 30%,transparent)}
    50%{opacity:1;text-shadow:0 0 14px color-mix(in srgb,var(--accent) 85%,transparent),0 0 30px color-mix(in srgb,var(--accent) 55%,transparent)}}

  .previewtag{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--accent);background:var(--card);border:1px solid var(--accent);border-radius:100px;padding:4px 12px;box-shadow:var(--shadow)}

  .adminlogin{max-width:340px;margin:auto}
  .lock{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .pinbox{letter-spacing:.5em;text-align:center;font-size:22px !important;font-weight:800}
  .err{color:#e5484d;font-size:12.5px;font-weight:600;text-align:center;margin-top:12px;min-height:16px}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:14px}
  table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:560px}
  th,td{padding:11px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);background:var(--bg2);position:sticky;top:0}
  td.mb{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .adbar{display:flex;gap:8px;align-items:center;margin-top:14px}
  .adbar input{flex:1;font-family:inherit;font-size:14px;background:var(--bg2);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--ink)}
  .adstat{display:flex;gap:10px;margin-top:14px}
  .adstat .s{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
  .adstat .s b{font-size:22px;font-weight:850;display:block;font-variant-numeric:tabular-nums}
  .adstat .s span{font-size:11px;color:var(--ink2);letter-spacing:.04em}

  .helpmodal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,15,22,.55)}
  .helpmodal.open{display:flex}
  .helpcard{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);max-width:380px;width:100%;padding:24px}
  .helpcard h2{margin-bottom:4px}
  .hlist{display:flex;flex-direction:column;gap:14px;margin:18px 0}
  .hitem{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--ink)}
  .hitem .n{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
</style>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <svg class="tgt" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="var(--accent)" stroke-width="2"/><circle cx="12" cy="12" r="5.5" stroke="var(--accent2)" stroke-width="2"/><circle cx="12" cy="12" r="1.6" fill="var(--accent)"/></svg>
      <div><span id="brand-tag">성격 조준소</span><small id="brand-sub">PERSONALITY RANGE</small></div>
    </div>
    <div class="langsw">
      <button class="langbtn" id="lang-ko" onclick="setLang('ko')">한</button>
      <button class="langbtn" id="lang-en" onclick="setLang('en')">EN</button>
      <button class="langbtn" id="lang-vi" onclick="setLang('vi')">VI</button>
    </div>
  </div>

  <!-- INTRO -->
  <section class="screen active" id="s-intro">
    <div class="hero">
      <svg class="heroTarget" width="122" height="122" viewBox="0 0 128 128" fill="none">
        <circle cx="64" cy="64" r="60" stroke="var(--line)" stroke-width="2"/><circle cx="64" cy="64" r="46" stroke="var(--accent2)" stroke-width="3"/>
        <circle cx="64" cy="64" r="30" stroke="var(--accent)" stroke-width="3"/><circle cx="64" cy="64" r="14" fill="color-mix(in srgb,var(--accent) 18%,transparent)"/>
        <circle cx="64" cy="64" r="5" fill="var(--accent)"/><line x1="64" y1="2" x2="64" y2="20" stroke="var(--ink2)" stroke-width="2"/>
        <line x1="64" y1="108" x2="64" y2="126" stroke="var(--ink2)" stroke-width="2"/><line x1="2" y1="64" x2="20" y2="64" stroke="var(--ink2)" stroke-width="2"/>
        <line x1="108" y1="64" x2="126" y2="64" stroke="var(--ink2)" stroke-width="2"/></svg>
      <span class="eyebrow" id="i-eyebrow">MBTI · 별자리 · 혈액형</span>
      <h1 id="i-title">당신의 성격,<br>정중앙에 조준한다</h1>
      <p class="lead" id="i-lead"></p>
      <div class="feat">
        <div class="featrow"><span class="ic">◎</span> <span id="i-f1"></span></div>
        <div class="featrow"><span class="ic">★</span> <span id="i-f2"></span></div>
        <div class="featrow"><span class="ic">✦</span> <span id="i-f3"></span></div>
      </div>
    </div>
    <div class="stickycta">
      <div class="btnrow">
        <button class="btn" id="i-start" onclick="go('reg')">검사 시작하기 →</button>
        <button class="helpbtn" id="i-help" onclick="openHelp()">도움말</button>
      </div>
      <div class="countline" id="count-line"></div>
    </div>
    <div class="ryongwrap"><button class="ryong" onclick="go('adminlogin')">RYONG</button></div>
  </section>

  <!-- REGISTER -->
  <section class="screen" id="s-reg">
    <span class="eyebrow" id="r-eyebrow">STEP 1</span>
    <h2 style="margin-top:8px" id="r-title"></h2>
    <p class="lead" style="margin-top:8px" id="r-lead"></p>
    <div class="card pad" style="margin-top:18px">
      <div class="field"><label id="l-country">나라</label><div class="chips" id="f-country">
        <div class="chip" role="button" aria-pressed="false" data-v="ko">🇰🇷 한국어</div>
        <div class="chip" role="button" aria-pressed="false" data-v="en">🇺🇸 English</div>
        <div class="chip" role="button" aria-pressed="false" data-v="vi">🇻🇳 Tiếng Việt</div></div></div>
      <div class="field"><label id="l-name">실명 (실제 이름)</label><input id="f-name" type="text" autocomplete="off"><div class="fhint" id="name-help"></div></div>
      <div class="field"><label id="l-cat">구분</label><div class="chips" id="f-cat">
        <div class="chip" role="button" aria-pressed="false" data-v="일반"><span id="cat1">일반</span></div>
        <div class="chip" role="button" aria-pressed="false" data-v="동호인"><span id="cat2">동호인</span></div>
        <div class="chip" role="button" aria-pressed="false" data-v="선수"><span id="cat3">선수</span></div></div></div>
      <div class="field"><label id="l-sex">성별</label><div class="chips" id="f-sex">
        <div class="chip" role="button" aria-pressed="false" data-v="남"><span id="sex1">남</span></div>
        <div class="chip" role="button" aria-pressed="false" data-v="여"><span id="sex2">여</span></div>
        <div class="chip" role="button" aria-pressed="false" data-v="비공개"><span id="sex3">비공개</span></div></div></div>
      <div class="field"><label id="l-birth">생년월일</label><input id="f-birth" type="date" min="1930-01-01" max="2025-12-31"></div>
      <div class="field"><label id="l-blood">혈액형</label><div class="chips" id="f-blood">
        <div class="chip" role="button" aria-pressed="false" data-v="A">A</div>
        <div class="chip" role="button" aria-pressed="false" data-v="B">B</div>
        <div class="chip" role="button" aria-pressed="false" data-v="O">O</div>
        <div class="chip" role="button" aria-pressed="false" data-v="AB">AB</div></div></div>
      <div class="note">

function renderQ(){
 const q=Q[idx],t=T();
 setTxt("q-count",t.q_of(idx+1,Q.length));setTxt("q-axis",t.axis[q.ax]);
 $("#bar").style.width=(idx/Q.length*100)+"%";$("#ring").style.strokeDashoffset=113-(113*idx/Q.length);
 setTxt("q-text",q[L][0]);
 const sel=answers[idx]?answers[idx].w:null,lb=t.scale_labels;
 const col=(w,cls,lab)=>'<div class="dcol"><button class="d '+cls+(sel===w?' sel':'')+'" data-w="'+w+'" aria-label="'+lab+'"></button><span class="dotlab">'+lab+'</span></div>';
 $("#q-opts").innerHTML=
  '<div class="pole poleA"><span class="ptag a">A</span><span>'+q[L][1]+'</span></div>'+
  '<div class="scalehint">'+t.scale_hint+'</div>'+
  '<div class="dots">'+col(3,'d3 a',lb[0])+col(2,'d2 a',lb[1])+col(1,'d1 a',lb[2])+col(0,'d0',lb[3])+col(-1,'d1 b',lb[4])+col(-2,'d2 b',lb[5])+col(-3,'d3 b',lb[6])+'</div>'+
  '<div class="pole poleB"><span class="ptag b">B</span><span>'+q[L][2]+'</span></div>';
 $("#q-opts").querySelectorAll('.d').forEach(b=>b.onclick=()=>answer(+b.dataset.w));

}
function answer(w){
 answers[idx]={ax:Q[idx].ax,w};idx++;
 if(idx>=Q.length){finish();}
 else if(idx%10===0){showCheer(idx/10-1);}
 else renderQ();
}
function prevQ(){if(idx>0){idx--;renderQ();}}

function finish(){
 $("#bar").style.width="100%";$("#ring").style.strokeDashoffset="0";
 const P1={EI:"E",SN:"S",TF:"T",JP:"J"},P2={EI:"I",SN:"N",TF:"F",JP:"P"},AX=["EI","SN","TF","JP"];
 const sums={EI:0,SN:0,TF:0,JP:0};answers.forEach(a=>sums[a.ax]+=a.w);
 const left={},weak=[];
 const code=AX.map(ax=>{let lp=Math.round(50+(sums[ax]/30)*50);lp=Math.max(2,Math.min(98,lp));left[ax]=lp;if(Math.abs(lp-50)<=8)weak.push(ax);return sums[ax]>=0?P1[ax]:P2[ax];}).join("");
 const clarity=Math.round(AX.reduce((s,ax)=>s+Math.abs(left[ax]-50)*2,0)/4);
 profile.mbti=code;profile.saved=false;lastResult={code,left,clarity,weak,P1,P2};
 renderResultText();go("result");saveResult(); // 저장모드: 자동 저장
}

 setTxt("r-code",code);setTxt("r-nick",ty[0]);setTxt("r-title",ty[1]);setTxt("r-desc",ty[2]);
 $("#r-clarity").innerHTML=t.clarity(lastResult.clarity);
 const bars=$("#r-bars");bars.innerHTML="";
 [["EI","E","I"],["SN","S","N"],["TF","T","F"],["JP","J","P"]].forEach(([ax,l,r])=>{
  const lp=left[ax],win=lp>=50;
  bars.innerHTML+='<div class="bar"><div class="lab"><span class="'+(win?'on':'')+'">'+l+' '+t.pole[l]+' '+lp+'%</span><span class="'+(!win?'on':'')+'">'+(100-lp)+'% '+r+' '+t.pole[r]+'</span></div><div class="track"><i style="left:0;width:'+lp+'%"></i></div></div>';
 });
 const tr=$("#r-traits");tr.innerHTML="";
 [[t.trait[0],left.EI],[t.trait[1],100-left.SN],[t.trait[2],100-left.TF],[t.trait[3],left.JP]].forEach(([nm,v])=>{
  tr.innerHTML+='<div class="bar"><div class="lab"><span class="on">'+nm+'</span><span>'+v+'%</span></div><div class="track"><i style="left:0;width:'+v+'%"></i></div></div>';
 });
 const wk=$("#r-weak");
 if(lastResult.weak&&lastResult.weak.length){wk.style.display="block";wk.innerHTML=lastResult.weak.map(ax=>t.weak_note(t.axis[ax])).join("<br>");}
 else{wk.style.display="none";wk.innerHTML="";}
 const [m,d]=profile.birth.split("-").slice(1).map(Number),z=zodiacOf(m,d);
 profile.zodiac=z.ko[0];profile.zodiac_i18n=z[L][0];
 setTxt("z-emoji",z.e+" ");setTxt("z-name",z[L][0]);setTxt("z-desc",z[L][1]);
 const bl=BLD[profile.blood][L];setTxt("b-name",bl[0]);setTxt("b-desc",bl[1]);
 setTxt("r-combo",t.combo(profile.name,ty[0],code,z[L][0],bl[0],profile.blood));
}
function setSaveBtn(){const t=T(),b=$("#save-btn");b.textContent=profile.saved?t.saved:t.save;b.disabled=profile.saved;}

function saveResult(){
 if(profile.saved)return;
 const t=T(),btn=$("#save-btn");btn.disabled=true;btn.textContent=t.saving;
 const payload={ts:new Date().toISOString(),name:profile.name,lang:profile.lang,cat:profile.cat,sex:profile.sex,birth:profile.birth,blood:profile.blood,mbti:profile.mbti,zodiac:profile.zodiac};
 const finishSave=()=>{profile.saved=true;let c=+(localStorage.getItem("mbti_count")||0)+1;localStorage.setItem("mbti_count",c);renderCount();setSaveBtn();};
 if(GAS_URL){fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(finishSave).catch(finishSave);}
 else{const arr=JSON.parse(localStorage.getItem("mbti_rows")||"[]");arr.push(payload);localStorage.setItem("mbti_rows",JSON.stringify(arr));setTimeout(finishSave,450);}
}
function restart(){
 document.querySelectorAll('#f-cat .chip,#f-sex .chip,#f-blood .chip').forEach(c=>c.setAttribute("aria-pressed","false"));
 $("#f-name").value="";$("#f-birth").value="";lastResult=null;validate();go("intro");
}

/* ADMIN */
$("#pin").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});
function tryLogin(){if($("#pin").value===ADMIN_PIN){$("#pin").value="";$("#pin-err").textContent="";go("admin");loadList();}else{$("#pin-err").textContent=T().admin_wrong;}}
function loadList(){
 $("#a-note").textContent=T().loading;
 if(GAS_URL){const cb="__mbti_cb_"+Date.now();window[cb]=res=>{adminData=(res&&res.rows)||[];renderTable();delete window[cb];};
  const s=document.createElement("script");s.src=GAS_URL+"?action=list&pw="+encodeURIComponent(ADMIN_PIN)+"&callback="+cb;
  s.onerror=()=>{$("#a-note").textContent=T().failed;};document.body.appendChild(s);}
 else{adminData=JSON.parse(localStorage.getItem("mbti_rows")||"[]").slice().reverse();renderTable();}
}
function renderTable(){
 const t=T(),q=($("#a-search").value||"").trim().toLowerCase();
 const rows=adminData.filter(r=>!q||(r.name||"").toLowerCase().includes(q)||(r.mbti||"").toLowerCase().includes(q));
 const tb=$("#a-rows");tb.innerHTML="";
 const today=new Date().toISOString().slice(0,10);let todayN=0,athN=0;
 adminData.forEach(r=>{if((r.ts||"").slice(0,10)===today)todayN++;if(r.cat==="선수")athN++;});
 setTxt("a-total",adminData.length);setTxt("a-athlete",athN);setTxt("a-today",todayN);
 if(!rows.length){tb.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--ink2);padding:26px">'+t.nodata+'</td></tr>';$("#a-note").textContent="";return;}
 rows.forEach(r=>{tb.innerHTML+='<tr><td>'+(r.ts||"").slice(0,10)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.cat)+'</td><td>'+esc(r.sex)+'</td><td>'+esc(r.birth)+'</td><td class="mb">'+esc(r.mbti)+'</td><td>'+esc(r.zodiac)+'</td><td>'+esc(r.blood)+'</td></tr>';});
 $("#a-note").textContent=GAS_URL?t.linked:t.mock;
}
function esc(v){return (v==null?"":String(v)).replace(/[<>&]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]));}

/* INIT */
setLang(localStorage.getItem("mbti_lang")||"ko");
</script>
